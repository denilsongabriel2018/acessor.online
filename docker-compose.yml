# Modo Swarm (Portainer Stack) NAO suporta "build:" - o stack so roda uma
# imagem ja pronta. Por isso aqui e so "image:" - as imagens precisam ser
# construidas manualmente ANTES de dar deploy/update na stack (veja
# instrucoes no final deste arquivo).
#
# Labels do Traefik ficam dentro de "deploy:" (nao soltas no servico) porque
# o provider e --providers.swarm=true - ele le labels do SERVICO do Swarm,
# nao do container.
services:
  api:
    image: acessor-api:latest
    environment:
      PORT: "3000"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-supabase}
      DEFAULT_WORKSPACE_ID: ${DEFAULT_WORKSPACE_ID}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      N8N_TO_API_SECRET: ${N8N_TO_API_SECRET}
      API_TO_N8N_SECRET: ${API_TO_N8N_SECRET}
      N8N_NOTIFICATION_WEBHOOK_URL: ${N8N_NOTIFICATION_WEBHOOK_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      # wget pode nao existir em node:22-alpine dependendo da build - usa o
      # proprio Node (sempre presente) pra checar, sem depender de mais nada.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - principal
    deploy:
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=principal"
        - "traefik.http.routers.agenda-api.rule=Host(`agenda-api.assessoriatrafegando.com.br`)"
        - "traefik.http.routers.agenda-api.entrypoints=websecure"
        - "traefik.http.routers.agenda-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.agenda-api.loadbalancer.server.port=3000"

  web:
    image: acessor-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - principal
    deploy:
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=principal"
        - "traefik.http.routers.agenda-web.rule=Host(`agenda.assessoriatrafegando.com.br`)"
        - "traefik.http.routers.agenda-web.entrypoints=websecure"
        - "traefik.http.routers.agenda-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.agenda-web.loadbalancer.server.port=80"

networks:
  principal:
    external: true

# ---------------------------------------------------------------------
# Como construir as imagens (rodar no servidor, via SSH, ANTES do deploy
# da stack e de novo toda vez que o codigo mudar):
#
#   git clone https://github.com/denilsongabriel2018/acessor.online.git
#   cd acessor.online
#   docker build -t acessor-api:latest -f apps/api/Dockerfile .
#   docker build -t acessor-web:latest -f apps/web/Dockerfile \
#     --build-arg VITE_API_URL=https://agenda-api.assessoriatrafegando.com.br \
#     --build-arg VITE_SUPABASE_URL=<sua SUPABASE_URL> \
#     --build-arg VITE_SUPABASE_ANON_KEY=<sua SUPABASE_ANON_KEY> \
#     .
#
# So depois disso a stack do Portainer acha as imagens "acessor-api:latest"
# e "acessor-web:latest" pra rodar.
# ---------------------------------------------------------------------
