# n8n fica fora deste arquivo (voce ja tem instancia hospedada separada).
# Roteamento externo e feito pelo Traefik, ja rodando na VPS - por isso os
# dois servicos entram na rede "principal" (a mesma rede do Traefik) e
# ganham labels em vez de depender so do mapeamento de porta.
#
# Pensado pra rodar tanto via `docker compose` (le um .env local) quanto via
# Portainer (Stacks a partir do repositorio git): como o .env NAO vai junto
# no git de proposito, as variaveis abaixo usam ${VAR} - o Portainer te
# deixa cadastrar cada uma na tela de criacao da stack.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-supabase}
      DEFAULT_WORKSPACE_ID: ${DEFAULT_WORKSPACE_ID}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      N8N_TO_API_SECRET: ${N8N_TO_API_SECRET}
      API_TO_N8N_SECRET: ${API_TO_N8N_SECRET}
      N8N_NOTIFICATION_WEBHOOK_URL: ${N8N_NOTIFICATION_WEBHOOK_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
    # Mantido como plano B pra acessar direto por IP:porta enquanto testamos
    # se o Traefik pega certinho - pode tirar depois que confirmar.
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - principal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=principal"
      - "traefik.http.routers.agenda-api.rule=Host(`agenda-api.assessoriatrafegando.com.br`)"
      - "traefik.http.routers.agenda-api.entrypoints=websecure"
      - "traefik.http.routers.agenda-api.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.agenda-api.loadbalancer.server.port=3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - principal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=principal"
      - "traefik.http.routers.agenda-web.rule=Host(`agenda.assessoriatrafegando.com.br`)"
      - "traefik.http.routers.agenda-web.entrypoints=websecure"
      - "traefik.http.routers.agenda-web.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.agenda-web.loadbalancer.server.port=80"

networks:
  principal:
    external: true
